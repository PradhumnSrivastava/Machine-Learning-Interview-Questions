name: Daily ML Questions Update

on:
  schedule:
    - cron: "30 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-questions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Process up to 10 questions
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          inbox = Path("Questions-Inbox.md")
          main_file = Path("Machine Learning Interview Questions.md")

          MAX_QUESTIONS = 10

          lines = inbox.read_text(encoding="utf-8").splitlines()

          questions = [
              line[2:].strip()
              for line in lines
              if line.strip().startswith("- ")
          ]

          questions = questions[:MAX_QUESTIONS]

          if not questions:
              print("No new questions found.")
              raise SystemExit(0)

          remaining_questions = questions.copy()

          for number, question in enumerate(questions, start=1):

              current_lines = inbox.read_text(encoding="utf-8").splitlines()

              removed = False
              new_lines = []

              for line in current_lines:
                  if not removed and line.strip() == f"- {question}":
                      removed = True
                      continue
                  new_lines.append(line)

              inbox.write_text(
                  "\n".join(new_lines).rstrip() + "\n",
                  encoding="utf-8"
              )

              content = main_file.read_text(encoding="utf-8").rstrip()

              if not content.startswith("# Machine Learning Interview Questions"):
                  raise RuntimeError("Main Markdown file has an unexpected structure.")

              question_block = f"""

          ---

          ## Daily Question

          ### {question}

          **Answer:** _To be added._

          """

              main_file.write_text(
                  content + question_block,
                  encoding="utf-8"
              )

              subprocess.run(["git", "add", str(inbox), str(main_file)], check=True)

              subprocess.run(
                  ["git", "commit", "-m", f"Add daily ML question: {question}"],
                  check=True
              )

              subprocess.run(["git", "push", "origin", "main"], check=True)

              print(f"Successfully pushed question {number}: {question}")

          PY