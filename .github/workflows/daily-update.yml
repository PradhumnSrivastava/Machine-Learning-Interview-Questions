name: Daily ML Questions Update

on:
  schedule:
    - cron: "30 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-questions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Process up to 10 questions
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import re

          inbox = Path("Questions-Inbox.md")
          main_file = Path("Machine Learning Interview Questions.md")

          MAX_QUESTIONS = 10

          text = inbox.read_text(encoding="utf-8")

          # Supports:
          # 1. Question? Ans- Answer
          # 1) Question? Ans- Answer
          # - Question? Ans- Answer
          pattern = re.compile(
              r"^(?:\s*(?:\d+[.)]\s+|[-*]\s+))(.+?)\s+Ans[-–—]\s*(.+)$",
              re.MULTILINE
          )

          matches = list(pattern.finditer(text))[:MAX_QUESTIONS]

          if not matches:
              print("No new questions found.")
              raise SystemExit(0)

          for number, match in enumerate(matches, start=1):

              question = match.group(1).strip()
              answer = match.group(2).strip()

              print(f"Processing question {number}: {question}")

              # Remove the processed question from the inbox.
              current_text = inbox.read_text(encoding="utf-8")

              escaped_question = re.escape(question)

              remove_pattern = re.compile(
                  rf"^\s*(?:\d+[.)]\s+|[-*]\s+){escaped_question}\s+Ans[-–—]\s*.+$\n?",
                  re.MULTILINE
              )

              new_text, count = remove_pattern.subn("", current_text, count=1)

              if count == 0:
                  raise RuntimeError(
                      f"Could not remove processed question from inbox: {question}"
                  )

              inbox.write_text(
                  new_text.rstrip() + "\n",
                  encoding="utf-8"
              )

              # Read the main question file.
              content = main_file.read_text(encoding="utf-8").rstrip()

              # Add the question and answer.
              question_block = f"""

          ---

          ## Interview Question

          ### {question}

          **Answer:** {answer}
          """

              main_file.write_text(
                  content + question_block,
                  encoding="utf-8"
              )

              # Commit and push this question separately.
              subprocess.run(
                  ["git", "add", str(inbox), str(main_file)],
                  check=True
              )

              subprocess.run(
                  [
                      "git",
                      "commit",
                      "-m",
                      f"Add ML interview question: {question}"
                  ],
                  check=True
              )

              subprocess.run(
                  ["git", "push", "origin", "main"],
                  check=True
              )

              print(f"Successfully pushed question {number}: {question}")

          PY