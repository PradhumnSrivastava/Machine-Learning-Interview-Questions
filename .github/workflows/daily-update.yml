name: Daily ML Questions Update

on:
  schedule:
    # 3:00 PM IST = 09:30 UTC
    - cron: "30 9 * * *"

  # Manual testing
  workflow_dispatch:

# Prevent multiple workflow runs from modifying main simultaneously
concurrency:
  group: daily-ml-questions
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-questions:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------
      # 2. Configure Git
      # --------------------------------------------------
      - name: Configure Git
        run: |
          git config user.name "PradhumnSrivastava"
          git config user.email "177670434+PradhumnSrivastava@users.noreply.github.com"

      # --------------------------------------------------
      # 3. Process questions
      # --------------------------------------------------
      - name: Process up to 10 questions
        run: |
          python - <<'PY'

          from pathlib import Path
          import subprocess
          import re

          inbox = Path("Questions-Inbox.md")
          main_file = Path("Machine Learning Interview Questions.md")

          MAX_QUESTIONS = 10

          # --------------------------------------------------
          # Read inbox
          # --------------------------------------------------

          text = inbox.read_text(encoding="utf-8")

          # Supported format:
          #
          # 1. Question? Ans- Answer
          # 2. Question? Ans- Answer
          # - Question? Ans- Answer
          # * Question? Ans- Answer

          pattern = re.compile(
              r"^(?:\s*(?:\d+[.)]\s+|[-*]\s+))"
              r"(.+?)\s+Ans[-–—]\s*(.+)$",
              re.MULTILINE
          )

          matches = list(pattern.finditer(text))[:MAX_QUESTIONS]

          if not matches:
              print("No new questions found.")
              raise SystemExit(0)

          print(f"Found {len(matches)} question(s).")

          # --------------------------------------------------
          # Process each question separately
          # --------------------------------------------------

          for number, match in enumerate(matches, start=1):

              question = match.group(1).strip()
              answer = match.group(2).strip()

              print()
              print("=" * 80)
              print(f"PROCESSING QUESTION {number}")
              print(f"Question: {question}")
              print("=" * 80)

              # --------------------------------------------------
              # Sync with latest main
              # --------------------------------------------------

              subprocess.run(
                  ["git", "fetch", "origin", "main"],
                  check=True
              )

              subprocess.run(
                  ["git", "reset", "--hard", "origin/main"],
                  check=True
              )

              # --------------------------------------------------
              # Read latest files
              # --------------------------------------------------

              current_inbox = inbox.read_text(
                  encoding="utf-8"
              )

              current_content = main_file.read_text(
                  encoding="utf-8"
              ).rstrip()

              # --------------------------------------------------
              # Remove question from inbox
              # --------------------------------------------------

              escaped_question = re.escape(question)

              remove_pattern = re.compile(
                  rf"^\s*(?:\d+[.)]\s+|[-*]\s+)"
                  rf"{escaped_question}"
                  rf"\s+Ans[-–—]\s*.+$\n?",
                  re.MULTILINE
              )

              new_inbox, count = remove_pattern.subn(
                  "",
                  current_inbox,
                  count=1
              )

              if count == 0:
                  raise RuntimeError(
                      f"Could not remove question from inbox: {question}"
                  )

              inbox.write_text(
                  new_inbox.rstrip() + "\n",
                  encoding="utf-8"
              )

              # --------------------------------------------------
              # Add question to main file
              # --------------------------------------------------

              question_block = f"""

          ---

          ## Interview Question

          ### {question}

          **Answer:** {answer}
          """

              main_file.write_text(
                  current_content + question_block,
                  encoding="utf-8"
              )

              # --------------------------------------------------
              # Stage changes
              # --------------------------------------------------

              subprocess.run(
                  [
                      "git",
                      "add",
                      str(inbox),
                      str(main_file)
                  ],
                  check=True
              )

              # --------------------------------------------------
              # Create ONE dedicated commit
              # --------------------------------------------------

              commit_message = (
                  f"Add ML Question {number}: {question}"
              )

              subprocess.run(
                  [
                      "git",
                      "commit",
                      "-m",
                      commit_message
                  ],
                  check=True
              )

              # --------------------------------------------------
              # Push ONLY this question's commit
              # --------------------------------------------------

              subprocess.run(
                  [
                      "git",
                      "push",
                      "origin",
                      "HEAD:main"
                  ],
                  check=True
              )

              print()
              print(
                  f"SUCCESS: Question {number} committed and pushed."
              )
              print(
                  f"Commit: {commit_message}"
              )

          # --------------------------------------------------
          # Finished
          # --------------------------------------------------

          print()
          print("=" * 80)
          print(
              f"FINISHED: {len(matches)} question(s) processed."
          )
          print("=" * 80)

          PY
