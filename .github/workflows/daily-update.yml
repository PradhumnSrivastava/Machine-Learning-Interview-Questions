name: Daily ML Questions Update

on:
  schedule:
    # 2:15 PM IST = 08:45 UTC
    - cron: "45 8 * * *"

  # Manual testing ke liye
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-questions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Process up to 10 questions
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import re

          inbox = Path("Questions-Inbox.md")
          main_file = Path("Machine Learning Interview Questions.md")

          MAX_QUESTIONS = 10

          text = inbox.read_text(encoding="utf-8")

          # Supported formats:
          #
          # 1. Question? Ans- Answer
          # 1) Question? Ans- Answer
          # - Question? Ans- Answer
          # * Question? Ans- Answer

          pattern = re.compile(
              r"^(?:\s*(?:\d+[.)]\s+|[-*]\s+))(.+?)\s+Ans[-–—]\s*(.+)$",
              re.MULTILINE
          )

          matches = list(pattern.finditer(text))[:MAX_QUESTIONS]

          if not matches:
              print("No new questions found.")
              raise SystemExit(0)

          print(f"Found {len(matches)} question(s).")

          for number, match in enumerate(matches, start=1):

              question = match.group(1).strip()
              answer = match.group(2).strip()

              print()
              print("=" * 80)
              print(f"Processing question {number}: {question}")
              print("=" * 80)

              # Sync with the latest remote state
              subprocess.run(
                  ["git", "fetch", "origin", "main"],
                  check=True
              )

              subprocess.run(
                  ["git", "rebase", "origin/main"],
                  check=True
              )

              # Read the latest files
              current_text = inbox.read_text(encoding="utf-8")
              content = main_file.read_text(encoding="utf-8").rstrip()

              # Remove this question from inbox
              escaped_question = re.escape(question)

              remove_pattern = re.compile(
                  rf"^\s*(?:\d+[.)]\s+|[-*]\s+){escaped_question}\s+Ans[-–—]\s*.+$\n?",
                  re.MULTILINE
              )

              new_text, count = remove_pattern.subn(
                  "",
                  current_text,
                  count=1
              )

              if count == 0:
                  raise RuntimeError(
                      f"Could not remove question from inbox: {question}"
                  )

              inbox.write_text(
                  new_text.rstrip() + "\n",
                  encoding="utf-8"
              )

              # Add question and answer to main file
              question_block = f"""

          ---

          ## Interview Question

          ### {question}

          **Answer:** {answer}
          """

              main_file.write_text(
                  content + question_block,
                  encoding="utf-8"
              )

              # Create a separate commit for this question
              subprocess.run(
                  ["git", "add", str(inbox), str(main_file)],
                  check=True
              )

              subprocess.run(
                  [
                      "git",
                      "commit",
                      "-m",
                      f"Add ML interview question: {question}"
                  ],
                  check=True
              )

              # Push this question separately
              subprocess.run(
                  ["git", "push", "origin", "HEAD:main"],
                  check=True
              )

              print(
                  f"SUCCESS: Question {number} committed and pushed."
              )

          print()
          print("=" * 80)
          print(f"Finished processing {len(matches)} question(s).")
          print("=" * 80)

          PY